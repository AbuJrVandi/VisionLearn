<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-powered assistive learning platform for visually impaired students" />
    <title>VisionLearn — AI Assistive Learning</title>
    <script>
      (function () {
        var saved = localStorage.getItem("visionlearn_dark_mode");
        var dark = saved !== null ? saved === "true" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
        var fontIdx = localStorage.getItem("visionlearn_font_index");
        if (fontIdx !== null) {
          var sizes = ["14px", "16px", "18px", "22px", "26px"];
          var idx = parseInt(fontIdx, 10);
          if (idx >= 0 && idx < sizes.length) {
            document.documentElement.style.setProperty("--font-size-base", sizes[idx]);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
